<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Evergro Portal</title>
<link rel="icon" type="image/svg+xml" href="/assets/portal/portal/favicon.svg">
{% for css in css_files %}
<link rel="stylesheet" href="/assets/portal/portal/{{ css }}">
{% endfor %}
<script>
{% for key in boot %}window["{{ key }}"] = {{ boot[key] | tojson }};
{% endfor %}
</script>
</head>
<body>
<div id="root"></div>
{% if js_file %}
<script type="module" src="/assets/portal/portal/{{ js_file }}"></script>
{% else %}
<p style="font-family:sans-serif;padding:40px;">Frontend not built yet — run <code>npm run build</code> in apps/portal/frontend.</p>
{% endif %}
</body>
</html>
